name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing reviewed release tag version (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends redis-server
          python -m pip install '.[test,mcp]'
      - name: Validate and build
        run: |
          ./scripts/palimnex_check.sh
          python -m mypy
          python -m build
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/palimnex-wheel"
          "$RUNNER_TEMP/palimnex-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/palimnex-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/package_smoke.py" --core-only
          "$RUNNER_TEMP/palimnex-wheel/bin/pip" install cryptography
          "$RUNNER_TEMP/palimnex-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/package_smoke.py"
      - name: Verify selected version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          from palimnex.core import BUNDLE_VERSION

          selected_version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', selected_version), 'stable version required'
          assert BUNDLE_VERSION == selected_version

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, f'expected one wheel, found {len(wheels)}'
          with ZipFile(wheels[0]) as wheel:
              metadata_files = [name for name in wheel.namelist() if name.endswith('.dist-info/METADATA')]
              assert len(metadata_files) == 1, 'expected one wheel METADATA file'
              metadata = BytesParser().parsebytes(wheel.read(metadata_files[0]))
          assert metadata['Name'] == 'palimnex'
          assert metadata['Version'] == selected_version
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/palimnex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
