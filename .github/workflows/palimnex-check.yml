name: Palimnex gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palimnex-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Redis and Python test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends redis-server
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test,mcp]'

      - name: Run standalone gate
        run: ./scripts/palimnex_check.sh

      - name: Type check and build distributions
        if: matrix.python-version == '3.11'
        run: |
          python3 -m mypy
          python3 -m build
          python3 -m twine check dist/*

      - name: Test installed wheel outside checkout
        if: matrix.python-version == '3.11'
        run: |
          python3 -m venv "$RUNNER_TEMP/palimnex-wheel"
          "$RUNNER_TEMP/palimnex-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/palimnex-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/package_smoke.py" --core-only
          "$RUNNER_TEMP/palimnex-wheel/bin/pip" install cryptography
          "$RUNNER_TEMP/palimnex-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/package_smoke.py"

  macos-gate:
    name: Python 3.11 / macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Redis and Python test dependencies
        run: |
          brew install redis
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test,mcp]'

      - name: Run standalone gate
        run: ./scripts/palimnex_check.sh
